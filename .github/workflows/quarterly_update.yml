name: Quarterly Figure Update

on:
  schedule:
    # Runs at 00:00 UTC on the 2nd day of Feb, May, Aug, and Nov
    - cron: '0 0 2 2,5,8,11 *'
  workflow_dispatch: # Allows you to trigger the run manually from the GitHub UI

jobs:
  update-figure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install system dependencies for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev

      - name: Install R packages
        run: |
          install.packages(c("readxl", "tidyquant", "tidyverse"))
        shell: Rscript {0}

      - name: Run R script to generate figure
        run: Rscript code/NGDPGAP_SPFtopbottom10.R

      - name: Update README timestamp
        run: |
          sed -i "s/^\*Last updated:.*/\*Last updated: $(date -u +'%Y-%m-%d %H:%M %Z')\*/" README.md

      - name: Commit and push updated figure and README
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add figures/ngdp_gap_figure.png README.md
          # Only commit if there are changes
          git diff-index --quiet HEAD || git commit -m "Auto-update quarterly figure and README timestamp"
          git push
